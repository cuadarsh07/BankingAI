# -----------------------------------------------------------------------------
# Banking Backend System - MySQL Profile Configuration
# -----------------------------------------------------------------------------
# To activate this profile, set:
#   spring.profiles.active=mysql
# or run with:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# -----------------------------------------------------------------------------

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3307/bankdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=bankuser
spring.datasource.password=bankpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable H2 console in MySQL profile
spring.h2.console.enabled=false

# Logging configuration (inherits MDC and package-level log levels)
logging.level.in.ashish.combined=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
