# -----------------------------------------------------------------------------
# Banking Backend System - Application Configuration
# -----------------------------------------------------------------------------

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,mysql}
spring.application.name=banking-backend

# Server Configuration (binds to cloud provider $PORT dynamically or 8080 locally)
server.port=${PORT:8080}

# =============================================================================
# DEFAULT PROFILE: In-Memory H2 Database (Runs immediately without any setup!)
# =============================================================================
# This allows you to run, test, and debug the entire application right away
# without having MySQL installed or running.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate DDL configuration: 'update' automatically generates and updates tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (Access at http://localhost:8080/h2-console)
# JDBC URL in browser: jdbc:h2:mem:bankdb
# Username: sa
# Password: (leave empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.in.ashish.combined=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# Gemini AI Configuration (LangChain4j)
# =============================================================================
# Store API Key in environment variable GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
# Official models: gemini-1.5-flash, gemini-1.5-pro, gemini-2.0-flash. Can also configure custom or Gemini 5.4.
gemini.model-name=${GEMINI_MODEL_NAME:gemini-1.5-flash}
gemini.temperature=${GEMINI_TEMPERATURE:0.2}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}

