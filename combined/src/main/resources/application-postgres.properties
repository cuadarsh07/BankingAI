# -----------------------------------------------------------------------------
# Banking Backend System - PostgreSQL Profile Configuration
# -----------------------------------------------------------------------------
# To activate this profile, set:
#   spring.profiles.active=postgres
# or run with:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# -----------------------------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bankpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

